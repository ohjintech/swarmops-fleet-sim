[project]
name = "swarmops-fleet-sim"
version = "0.1.0"
description = "Simulated drone fleet that speaks the SwarmOps MQTT protocol"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "swarmops-contracts",
]

[project.scripts]
fleet-sim = "fleet_sim.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv.sources]
# Local sibling checkout until swarmops-contracts publishes a release.
# Afterwards: swarmops-contracts = { url = "https://github.com/swarm-ops/swarmops-contracts/releases/download/vX.Y.Z/swarmops_contracts-X.Y.Z-py3-none-any.whl" }
swarmops-contracts = { path = "../swarmops-contracts/gen/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_sim"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
